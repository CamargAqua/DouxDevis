services:
  - type: web
    name: doux-devis
    env: python
    pythonVersion: "3.11.0"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 120
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: GIST_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # --- Devisly (monté sous /devisly) ---
      # Coller ici l'External Database URL de la Postgres "devisly-db2" (dashboard Render).
      - key: DATABASE_URL
        sync: false
      - key: PRIMARY_TENANT_SLUG
        value: doux
      - key: SESSION_COOKIE_NAME
        value: devisly_session
      - key: SESSION_COOKIE_PATH
        value: /devisly
      - key: SHOW_DOUXDEVIS_TOGGLE
        value: "1"
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: YOUSIGN_API_KEY
        sync: false
